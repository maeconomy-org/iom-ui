# Commands:
#   Start:    docker compose up -d
#   Stop:     docker compose down
#   Update:   ./deploy.sh update
#   Logs:     docker compose logs -f
#   Rollback: ./deploy.sh rollback

# One network: `frontend` carries the host-published port (nginx -> ui).
#
# There was a second, internal `backend` network here, and a Redis alongside it. Both are gone:
# Redis backed the OLD import pipeline — a job system that ran in this Next.js process — and the
# storage node now owns that work end to end.
#
# The telemetry ingest route also rate-limited through it, and that limiter is now in process
# memory: it always had that fallback for when Redis was unavailable, and running a container to
# throttle one endpoint is the tail wagging the dog. The trade is that the counter is per replica,
# which is exactly right while this stack runs a single UI container — revisit if it scales out.
networks:
  frontend:
    driver: bridge

services:
  # ===========================================================================
  # IoM UI Application
  # ===========================================================================
  ui:
    image: ghcr.io/${GH_ORG}/${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks: [frontend]
    env_file:
      - .env
    # Bind to loopback so the app is only reachable through nginx on this host.
    # EXTERNAL_PORT lets multiple UI stacks coexist on one VM (each picks a unique
    # host port). The container port stays fixed at 3000 — Next.js standalone +
    # the rest of the stack assume 3000 internally; changing it breaks healthchecks
    # and inter-container references.
    ports:
      - '127.0.0.1:${EXTERNAL_PORT}:3000'
    environment:
      # Pin the in-container Next.js server to 3000 / all interfaces so the
      # healthcheck and nginx upstream can reach it regardless of EXTERNAL_PORT.
      - PORT=3000
      - HOST=0.0.0.0
      # SENTRY_RELEASE is auto-detected from APP_VERSION baked into the image
      # Only set to override: SENTRY_RELEASE=1.0.12
      # All other variables are loaded from .env file automatically
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # Resource Limits (uncomment to enable)
  # =========================================================================
  # deploy:
  #   resources:
  #     limits:
  #       cpus: '1.0'
  #       memory: 1G
  #     reservations:
  #       cpus: '0.25'
  #       memory: 256M
